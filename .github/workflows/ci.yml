name: CI

# Run on every push and every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN is read only by default, packages: write lets this token
# push images to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Pulls the exact commit that triggered this run onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned version avoids silent breakage from an unannounced upgrade
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If any test fails, this step fails and nothing downstream runs
      - name: Run tests
        run: python -m pytest tests/ -v

  docker-build:
    # Only starts after build-test passes, a broken commit never gets an image built
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      # Fresh checkout since this is a separate job on a separate runner,
      # nothing carries over from the build-test job automatically
      - name: Checkout code
        uses: actions/checkout@v4

      # GITHUB_TOKEN is auto generated per run, no manual secret setup needed
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit sha so every image is traceable to exact source code
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  security-scan:
    # Scans the actual image that was just built and pushed
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      # Trivy needs to authenticate too, this job runs on its own fresh runner
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # exit code 1 on high or critical findings is what makes this a gate,
      # not just a report, this is what stops a vulnerable image from
      # reaching the deploy job
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          # Skips CVEs with no vendor fix yet, so the gate cannot block forever
          ignore-unfixed: true
          exit-code: 1

  promote-image:
    # Only runs once the image has actually passed the scan
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Server side copy by digest, the image is never pulled or rebuilt here,
      # so its bytes are guaranteed identical to what the scan checked
      - name: Import scanned image into ACR
        run: |
          az acr import \
            --name ticketpipelineacr \
            --source ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --image ticket-pipeline-demo:${{ github.sha }} \
            --image ticket-pipeline-demo:latest \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --force
