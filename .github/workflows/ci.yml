name: CI

# Run on every push and every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Pulls the exact commit that triggered this run onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned version avoids silent breakage from an unannounced upgrade
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If any test fails, this step fails and nothing downstream runs
      - name: Run tests
        run: python -m pytest tests/ -v
